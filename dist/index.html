<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hermes · Learn together</title>
<link rel="icon" href="data:,">
<script>
  // Apply the saved theme before the page paints, so dark mode does not flash light first.
  try {
    var p = JSON.parse(localStorage.getItem('hermes-prefs') || '{}');
    var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    if (p.size) document.documentElement.dataset.size = p.size;
  } catch (e) {}
</script>
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/app.js"></script>
</head>
<body>
<a class="skip-link" href="#app">Skip to main content</a>
<aside>
  <h2 class="logo">hermes.</h2>
  <nav id="nav" aria-label="Main"></nav>
</aside>
<main>
  <div class="top"><span>YOUR LEARNING SPACE</span><span class="badge">Prototype · sample community</span></div>
  <p id="storage-warning" class="storage-warning" role="alert" hidden></p>
  <p id="flash" class="flash" role="status" hidden></p>
  <div id="app" tabindex="-1">
    <p class="notice">Loading Hermes. If this message stays, start the local server described in README.md. The app uses JavaScript modules, which browsers will not load from a file opened directly.</p>
    <noscript><p class="notice">Hermes needs JavaScript turned on.</p></noscript>
  </div>
</main>
<dialog id="modal"></dialog>
<dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-text"><p id="confirm-text"></p><div class="actions"><button type="button" data-confirm="yes">Confirm</button><button type="button" class="secondary" data-confirm="no">Cancel</button></div></dialog>
</body>
</html>
